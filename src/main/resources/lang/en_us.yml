npc:
  usage: '<error>Usage: <accent>/eternpc menu</accent>, <accent>create \<name></accent>, <accent>edit [name]</accent>, <accent>copy \<name> \<new></accent>, <accent>delete \<name> confirm</accent>, <accent>place \<npc></accent>, <accent>remove</accent>, <accent>move [npc]</accent>, <accent>tp \<npc></accent>, <accent>cleanup [prefix confirm]</accent>, <accent>list</accent>, <accent>reload'
  list: '<info>NPCs defined here <dark_gray>(placements)</dark_gray>: <accent><npcs>'
  list-empty: '<info>No NPC defined on this server.'
  reloaded: '<info>NPCs and placements reloaded.'
  unknown: '<error>Unknown NPC: <accent><npc></accent>. See <accent>/eternpc menu</accent>.'
  placed: '<info>NPC <accent><npc></accent> placed here.'
  removed: '<info>Placement of NPC <accent><npc></accent> removed.'
  moved: '<info>NPC <accent><npc></accent> is now here.'
  none-near: '<error>No NPC within <accent><radius></accent> blocks.'
  not-here: '<error>NPC <accent><npc></accent> is not placed anywhere on this server.'
  invalid-name: '<error>Invalid name: lowercase letters, digits, - and _ (32 at most).'
  exists: '<error>NPC <accent><npc></accent> already exists.'
  created: '<info>NPC <accent><npc></accent> created and placed here. Set it up in the editor.'
  copied: '<info>NPC <accent><npc></accent> copied as <accent><target></accent>, placed here.'
  copy-usage: '<error>Usage: <accent>/eternpc copy \<name> \<new></accent>'
  reputation-usage: '<error>Usage: <accent>/eternpc reputation \<name> [ratio]</accent> <gray>(ratio from 0 to 10, 1 by default)'
  reputation-ratio: '<info>Reputation ratio of <accent><npc></accent>: <accent><ratio></accent> <gray>(player reputation × ratio = their reputation with this NPC)'
  reputation-set: '<success>Reputation ratio of <accent><npc></accent>: <accent><ratio></accent>.'
  delete-confirm: '<error>Delete <accent><npc></accent> and all its placements, everywhere? <accent>/eternpc delete <npc> confirm'
  deleted: '<info>NPC <accent><npc></accent> deleted, with its placements.'
  cleanup-confirm: '<error>Delete every placement of <accent><prefix>*</accent> NPCs on the network? <accent>/eternpc cleanup <prefix> confirm'
  cleaned: '<info><accent><count></accent> placement(s) deleted.'
  no-permission: '<error>This NPC does not answer you.'
  cooldown: '<error>Wait <accent><time>s</accent>.'
  mood:
    stranger: "<dark_gray>(<name><dark_gray> does not know you yet)"
    known: "<dark_gray>(<name><dark_gray> recognises you)"
    like: "<dark_gray>(<name><dark_gray> likes you)"
    trust: "<dark_gray>(<name><dark_gray> trusts you)"
    esteem: "<dark_gray>(<name><dark_gray> holds you in high esteem)"
  dialogue:
    line: '<name> <dark_gray>»</dark_gray> <info><text>'
    choice: '<accent>[<choice>]</accent>'
    choice-hover: '<info>Click to choose'

names:
  guild-master: '<accent>Guild master'

editor:
  title: '<primary>NPC <dark_gray>·</dark_gray> <npc>'
  save: 'Save'
  saved: '<info>Saved.'
  not-saved: '<error>Nothing was saved: fix the actions and try again.'
  action-error: '<error><problem>'
  current: '<dark_gray>Current: '
  none: '<dark_gray>None'
  yes: '<success>yes'
  no: '<error>no'
  back: '<accent>« All NPCs'
  info:
    name: '<accent><npc>'
    placed: '<dark_gray>▸ <info>Placements on this server: <accent><count>'
    clicks: '<dark_gray>▸ <info>Clicks: <accent><count>'
  name:
    name: '<accent>Name'
    lore: '<dark_gray>MiniMessage, or "lang:key" (lang/ > names)'
    title: '<primary>Name of <npc>'
    body: '<info>The name above its head (MiniMessage).'
    label: 'Name'
  description:
    name: '<accent>Line under the name'
    lore: '<dark_gray>E.g. "Guild master". Empty: none.'
    title: '<primary>Line under the name of <npc>'
    body: '<info>Text under the name (MiniMessage), empty for none.'
    label: 'Line'
  skin:
    name: '<accent>Skin'
    lore: '<dark_gray>A player name, or a texture (MineSkin)'
    title: '<primary>Skin of <npc>'
    body: '<info>A player name, or the value and signature of a texture (takes priority).'
    player: 'Player name'
    value: 'Texture: value'
    signature: 'Texture: signature'
  equipment:
    name: '<accent>Equipment'
    lore: '<dark_gray>Click with an item in hand: it wears it · Shift: off hand · right click: remove all'
    hold: '<error>Hold the item to give it.'
  pose:
    name: '<accent>Pose'
    lore: '<dark_gray>Click: next pose'
  scale:
    name: '<accent>Size'
    lore: '<dark_gray>Click: bigger · right click: smaller'
  glow:
    name: '<accent>Glow'
    lore: '<dark_gray>Click: toggle'
  actions-right:
    name: '<accent>Right click'
    lore: '<dark_gray>Actions run, one per line (e.g. eterjob:quests mineur)'
    title: '<primary>Right click on <npc>'
    body: '<info>One action per line. "?condition" stops the rest when false. /eterlib actions for the list.'
    label: 'Actions'
  actions-left:
    name: '<accent>Left click'
    lore: '<dark_gray>Actions run on hit'
    title: '<primary>Left click on <npc>'
    body: '<info>One action per line.'
    label: 'Actions'
  actions-shift:
    name: '<accent>Sneaking right click'
    lore: '<dark_gray>Empty: same as right click'
    title: '<primary>Sneaking right click on <npc>'
    body: '<info>One action per line; empty to act like the right click.'
    label: 'Actions'
  actions-placement:
    title: '<primary>Actions of this placement of <npc>'
    body: '<info>Replace the right click ones, for the nearest placement only. Empty: the NPC ones.'
    label: 'Actions'
  dialogue:
    name: '<accent>Dialogue'
    lore: '<dark_gray>Lines said on right click, and choices "> text | actions"'
    summary: '<info><lines> line(s), <choices> choice(s)'
    title: '<primary>Dialogue of <npc>'
    body: '<info>One line per sentence ({player} = the player). A choice: "> My quests | eterjob:quests mineur". Without choices, the right click actions follow.'
    label: 'Dialogue'
  sound:
    name: '<accent>Sound'
    lore: '<dark_gray>Played on click (e.g. entity.villager.ambient)'
    title: '<primary>Sound of <npc>'
    body: '<info>Key of a Minecraft sound, empty for none.'
    label: 'Sound'
  permission:
    name: '<accent>Permission'
    lore: '<dark_gray>Visible and clickable only with it'
    title: '<primary>Permission of <npc>'
    body: '<info>Empty: visible and clickable by everyone.'
    label: 'Permission'
  cooldown:
    name: '<accent>Cooldown'
    lore: '<dark_gray>Seconds between two clicks of a player'
    title: '<primary>Cooldown of <npc>'
    body: '<info>In seconds (0: only against double clicks).'
    label: 'Seconds'
    invalid: '<error>A whole number of seconds.'
  look:
    name: '<accent>Gaze'
    lore: '<dark_gray>Click: toggle · right click: distance'
    on: '<success>towards the nearest player</success> <dark_gray>(<range> blocks)'
    off: '<info>fixed'
  place:
    name: '<accent>Place here'
    lore: '<dark_gray>One more placement, where you stand'
  placement:
    name: '<accent>Actions of this placement'
    lore: '<dark_gray>For the nearest placement (5 blocks) only'
  test:
    name: '<accent>Try'
    lore: '<dark_gray>Runs its right click on you'
  delete:
    name: '<error>Delete'
    lore: '<dark_gray>The NPC and all its placements, everywhere'
    title: '<error>Delete <npc>?'
    body: '<info><npc> and its <accent><count></accent> placement(s) will be deleted on the whole network.'
    confirm: 'Delete'

list-menu:
  title: '<primary>NPCs <dark_gray>· <count>'
  placed: '<dark_gray>▸ <info>Placements here: <accent><count>'
  clicks: '<dark_gray>▸ <info>Clicks: <accent><count>'
  owner: '<dark_gray>▸ <info>Defined by <accent><plugin>'
  edit: '<accent>Click <dark_gray>· <info>edit'
  teleport: '<accent>Shift + click <dark_gray>· <info>go there'
  not-own: '<error><npc> belongs to another plugin: use its commands.'
  previous: '<accent>« Previous page'
  next: '<accent>Next page »'

menu:
  page-of: "<dark_gray>Page <page>/<pages>"

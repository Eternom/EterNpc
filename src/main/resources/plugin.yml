name: EterNpc
version: '${version}'

main: fr.eternom.eterNpc.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: PNJ du réseau (Mannequins natifs) pour les plugins Eter, avec leurs emplacements, et PNJ créés en jeu dont les clics lancent des actions.
depend: [EterLib]
# Sur un lobby, les emplacements sont communs à tous les lobbys
softdepend: [EterHub]

commands:
  eternpc:
    description: Créer, régler et placer les PNJ (staff).
    usage: /eternpc <menu|create|edit|copy|delete|place|remove|move|tp|cleanup|reputation|list|reload>
    aliases: [npc]
    permission: eternpc.admin

permissions:
  eternpc.admin:
    description: Créer, régler et placer les PNJ (/eternpc).
    default: op

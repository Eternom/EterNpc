name: EterNpc
version: '${version}'

main: fr.eternom.eterNpc.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: PNJ du réseau (Mannequins natifs) pour les plugins Eter, avec leurs emplacements.
depend: [EterLib]
# Sur un lobby, les emplacements sont communs à tous les lobbys
softdepend: [EterHub]

commands:
  eternpc:
    description: Gérer les emplacements des PNJ (staff).
    usage: /eternpc <list|place|remove|reload>
    aliases: [npc]
    permission: eternpc.admin

permissions:
  eternpc.admin:
    description: Gérer les emplacements des PNJ (/eternpc).
    default: op
